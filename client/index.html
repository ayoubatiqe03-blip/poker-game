<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Royal Flush — Poker</title>

    <!-- Preconnect so DNS+TLS is resolved before the CSS link fires -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      font-display=swap means the browser paints immediately with a system
      fallback, then swaps when the webfont arrives — no render-blocking.
      We also load only the weights we actually use (700 for Playfair,
      400+500 for DM Mono, 400+500+600 for DM Sans) to cut ~40 KB.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
